<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>meridian — rake the sand</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap">
<style>
  :root{--forest:#2F3D30;--vanilla:#F4EADB;--ink:#2F3D30}
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--vanilla);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .hero{position:relative;width:100%;height:min(100vh,860px);min-height:520px;overflow:hidden;background:#e9dfcf;cursor:crosshair}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block;user-select:none;-webkit-user-drag:none}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .copy{position:absolute;left:clamp(24px,6vw,96px);top:50%;transform:translateY(-50%);max-width:min(560px,60vw);pointer-events:none;z-index:2}
  .copy .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--forest);opacity:.75;margin-bottom:18px}
  .copy h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(44px,6.4vw,96px);line-height:.95;letter-spacing:-.02em;color:var(--forest)}
  .copy h1 i{font-style:italic}
  .copy p{margin-top:22px;font-size:clamp(15px,1.3vw,19px);line-height:1.5;color:var(--forest);opacity:.85;max-width:38ch}
  .copy .cta{margin-top:28px;display:flex;gap:12px;pointer-events:auto}
  .copy a{display:inline-block;padding:14px 24px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--forest);color:var(--forest)}
  .copy a.primary{background:var(--forest);color:var(--vanilla)}
  .hint{position:absolute;right:clamp(20px,3vw,40px);bottom:clamp(18px,2.6vw,32px);z-index:2;display:flex;align-items:center;gap:14px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--forest);opacity:.8;pointer-events:none}
  .hint button{pointer-events:auto;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:rgba(244,234,219,.7);border:1px solid rgba(47,61,48,.35);border-radius:999px;padding:9px 14px;cursor:pointer}
  .hint button:hover{background:rgba(244,234,219,.95)}
  @media (max-width:700px){.copy{max-width:86vw}.copy .cta{flex-direction:column}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <img src="sand.jpg" alt="A meridian vial standing in raked sand">
  <canvas id="sand"></canvas>
  <div class="copy">
    <div class="eyebrow">U.S.-made research materials</div>
    <h1>Research with <i>higher</i> standards.</h1>
    <p>Transparent, batch-specific laboratory documentation with every vial.</p>
    <div class="cta"><a class="primary" href="#">Shop research</a><a href="#">View lab results</a></div>
  </div>
  <div class="hint"><span id="hintText">Draw in the sand</span><button id="smooth" type="button">Smooth it over</button></div>
</section>
<script>
/* ---------------------------------------------------------------
   RAKE THE SAND — one groove at a time.
   The photograph is redrawn through a height field: where you drag, a
   single trough displaces the photo's own raked lines into itself, and
   its two flanks take light and shadow from the same side as the photo.
   Nothing is painted on top; the sand you see is the sand in the picture.
----------------------------------------------------------------*/
(function () {
  const hero = document.getElementById('hero'), cv = document.getElementById('sand'), photo = hero.querySelector('img');
  const ctx = cv.getContext('2d');
  const RES = 0.5;                                  /* work at half screen res */
  const LIGHT = { x: 0.9, y: -0.44 };               /* upper right, like the photo */
  const RADIUS = 5.6, DISPLACE = 7, DEPTH = 1;
  let W = 0, H = 0, w = 0, h = 0, field, src, srcData, out, outImg, grain;

  function fit() {
    W = hero.clientWidth; H = hero.clientHeight; if (!W || !H) return;
    cv.width = W; cv.height = H;
    w = Math.round(W * RES); h = Math.round(H * RES);
    field = new Float32Array(w * h);
    grain = new Float32Array(w * h); for (let i = 0; i < grain.length; i++) grain[i] = 0.8 + Math.random() * 0.4;
    src = document.createElement('canvas'); src.width = w; src.height = h;
    /* the photo, positioned exactly as object-fit: cover 62% 50% positions it */
    const iw = photo.naturalWidth, ih = photo.naturalHeight; if (!iw) return;
    const sc = Math.max(W / iw, H / ih), dw = iw * sc, dh = ih * sc;
    const ox = (W - dw) * 0.62, oy = (H - dh) * 0.5;
    const sx = src.getContext('2d'); sx.drawImage(photo, ox * RES, oy * RES, dw * RES, dh * RES);
    srcData = sx.getImageData(0, 0, w, h).data;
    out = document.createElement('canvas'); out.width = w; out.height = h;
    outImg = out.getContext('2d').createImageData(w, h);
    render();
  }

  function stamp(x, y) {
    const r = RADIUS, r2 = r * r;
    const x0 = Math.max(0, Math.floor(x - r * 2)), x1 = Math.min(w - 1, Math.ceil(x + r * 2));
    const y0 = Math.max(0, Math.floor(y - r * 2)), y1 = Math.min(h - 1, Math.ceil(y + r * 2));
    for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
      const d2 = (xx - x) * (xx - x) + (yy - y) * (yy - y);
      const i = yy * w + xx;
      const trough = Math.exp(-d2 / r2);                                  /* the groove */
      const lip = Math.exp(-((Math.sqrt(d2) - r * 1.6) ** 2) / (r * 1.4)) * 0.22;   /* sand pushed to the sides */
      field[i] = Math.max(-DEPTH, Math.min(DEPTH * 0.35, field[i] - trough * 0.45 + lip * 0.45));
    }
  }

  function render() {
    if (!srcData) return;
    const d = outImg.data, S = srcData;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const gx = (x > 0 && x < w - 1) ? field[i + 1] - field[i - 1] : 0;
      const gy = (y > 0 && y < h - 1) ? field[i + w] - field[i - w] : 0;
      /* pull the picture toward the trough: the raked lines bend into it */
      let sx = x + gx * DISPLACE, sy = y + gy * DISPLACE;
      sx = sx < 0 ? 0 : sx > w - 1 ? w - 1 : sx; sy = sy < 0 ? 0 : sy > h - 1 ? h - 1 : sy;
      const j = ((sy | 0) * w + (sx | 0)) * 4;
      const shade = (gx * LIGHT.x + gy * LIGHT.y) * grain[i] * 2.4;    /* + lit, - shadow */
      const k = Math.max(0.72, Math.min(1.16, 1 + shade));
      const p = i * 4;
      d[p] = Math.min(255, S[j] * k); d[p + 1] = Math.min(255, S[j + 1] * k); d[p + 2] = Math.min(255, S[j + 2] * k); d[p + 3] = 255;
    }
    out.getContext('2d').putImageData(outImg, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(out, 0, 0, W, H);
  }

  let last = null, drawing = false, dirty = false;
  const toField = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * RES, y: (e.clientY - r.top) * RES }; };
  function strokeTo(p) {
    if (!last) { last = p; stamp(p.x, p.y); dirty = true; return; }
    const dx = p.x - last.x, dy = p.y - last.y, len = Math.hypot(dx, dy);
    if (len < 0.5) return;
    const steps = Math.ceil(len / 0.9);
    for (let k = 1; k <= steps; k++) stamp(last.x + dx * k / steps, last.y + dy * k / steps);
    last = p; dirty = true;
  }
  cv.addEventListener('pointerdown', e => { drawing = true; last = null; strokeTo(toField(e)); try { cv.setPointerCapture(e.pointerId); } catch (_) {} hint(false); });
  cv.addEventListener('pointermove', e => { if (drawing) strokeTo(toField(e)); });
  const end = () => { drawing = false; last = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  document.getElementById('smooth').addEventListener('click', () => { field.fill(0); dirty = true; hint(true); });
  function hint(on) { document.getElementById('hintText').style.opacity = on ? '1' : '.35'; }

  window.__sand = { strokeTo, render, get field() { return field; }, reset() { last = null; } };   /* test hook */
  (function loop() { requestAnimationFrame(loop); if (dirty) { dirty = false; render(); } })();
  addEventListener('resize', fit);
  if (photo.complete && photo.naturalWidth) fit(); else photo.addEventListener('load', fit);

  /* one opening stroke, so it is obvious the sand can be drawn in */
  setTimeout(() => {
    if (!field) return;
    const pts = []; for (let i = 0; i <= 70; i++) { const t = i / 70; pts.push({ x: (0.08 + t * 0.44) * w, y: (0.74 - Math.sin(t * Math.PI) * 0.14) * h }); }
    let i = 0; last = null; const tick = () => { if (i < pts.length) { strokeTo(pts[i++]); setTimeout(tick, 16); } else last = null; }; tick();
  }, 900);
})();
</script>
</body>
</html>
